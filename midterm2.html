<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark;--bg:#0d1424;--panel:#172238;--panel2:#1f2c46;--text:#edf2fb;--muted:#9dacbf;--border:#364661;--accent:#82aaff;--good:#68d3a5;--bad:#ff899c;--shadow:0 9px 35px #0002}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.55}button,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}.shell{max-width:1120px;padding:28px 22px 75px;margin:auto}nav{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:26px}.brand{font-size:1.25rem;font-weight:850;letter-spacing:-.025em}.brand span{color:var(--accent)}.nav-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border-radius:11px;border:1px solid var(--border);color:var(--text);background:var(--panel);padding:10px 14px;font-weight:650}.btn:hover{border-color:var(--accent)}.btn.primary{background:#376bd3;border-color:#376bd3;color:#fff}.btn.red{background:transparent;color:var(--bad)}.btn.sm{font-size:.8rem;padding:6px 10px}.btn:disabled{opacity:.45;cursor:not-allowed}.panel{border:1px solid var(--border);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:24px}.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:stretch;margin-bottom:19px}.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(1.7rem,3.5vw,2.7rem);letter-spacing:-.045em;line-height:1.15;margin:10px 0}h2{font-size:1.15rem;margin:0 0 10px;letter-spacing:-.015em}p{margin:9px 0;color:var(--muted)}.hero p{max-width:620px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:var(--panel2);border-radius:12px;text-align:center;padding:17px 7px}.metric strong{font-size:1.8rem;display:block;line-height:1.2}.metric small{color:var(--muted);font-size:.75rem}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.count{color:var(--muted);font-size:.85rem}.quiet{font-size:.81rem;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--border);background:var(--panel2);padding:6px 10px;border-radius:100px;font-size:.76rem}.topic-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.topic{display:flex;gap:9px;align-items:start;padding:8px;border-radius:8px;cursor:pointer;font-size:.82rem}.topic:hover{background:var(--panel2)}.topic input{accent-color:var(--accent);margin-top:4px}.topic small{color:var(--muted)}.topic span{flex:1}.notice{border-left:3px solid var(--accent);padding:11px 14px;background:var(--panel2);border-radius:8px;font-size:.82rem;color:var(--muted);margin-top:16px}
.card-main{max-width:870px;margin:auto}.progress{height:9px;border-radius:100px;background:var(--panel2);overflow:hidden;margin:13px 0 19px}.progress div{height:100%;background:#6b9df4;transition:width .2s}.question-head{display:flex;justify-content:space-between;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.qstem{font-size:1rem;line-height:1.75;font-weight:620;white-space:pre-line;color:var(--text);margin:0 0 19px}.option{display:flex;align-items:stretch;gap:8px;margin:9px 0}.choice{display:flex;gap:12px;align-items:start;text-align:left;flex:1;border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:12px 13px;color:var(--text);font-size:.88rem;line-height:1.5}.choice strong{color:var(--accent);min-width:20px}.choice.selected{outline:2px solid var(--accent)}.choice.correct{outline:2px solid var(--good)}.choice.wrong{outline:2px solid var(--bad)}.choice.crossed{opacity:.43;text-decoration:line-through}.strike{min-width:33px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--muted);font-size:.85rem}.feedback{padding:15px;border:1px solid var(--border);border-radius:11px;background:var(--panel2);margin:17px 0}.feedback b{color:var(--text)}.feedback p{color:var(--text);font-size:.85rem}.whyline{font-size:.81rem;margin-top:7px;color:var(--muted)}.whyline strong{color:var(--accent)}.hint{margin-top:12px;color:var(--muted);font-size:.83rem}.toolrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}.pill{background:var(--panel2);border-radius:100px;padding:5px 10px;font-size:.75rem;color:var(--muted)}.figure{background:#fff;border-radius:12px;padding:14px;margin:16px 0;border:1px solid #d6dfed;text-align:center;color:#30435d}.figure svg{max-width:100%;height:auto}.figure figcaption{font-size:.73rem;margin-top:8px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.review-row{border-top:1px solid var(--border);padding:12px 0}.review-row b{font-size:.86rem}.review-row p{font-size:.79rem}.footer{text-align:center;color:var(--muted);font-size:.77rem;margin-top:32px}.hidden{display:none!important}
@media(max-width:740px){.shell{padding:16px 13px 50px}.hero,.grid{grid-template-columns:1fr}.panel{padding:17px}.topic-list{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.qstem{font-size:.9rem}.result-grid{grid-template-columns:1fr 1fr}.toolrow{align-items:stretch}}
</style></head><body><div class="shell"><nav><div class="brand">🧠 Neuro<span>Prep</span> <span class="pill">MIDTERM 2</span></div><div class="nav-actions"><a class="btn sm" href="./">← Midterm 1</a><button class="btn sm" id="theme" type="button">☀︎ Light / Dark</button></div></nav><main id="app"></main><div class="footer">Independent educational practice • University of Arizona Nervous System Weeks 4–5 • No faculty endorsement • Progress remains in your browser</div></div>
<script src="midterm2-questions.js?v=20261118"></script>
<script src="midterm2-week5.js?v=20261118"></script>
<script src="midterm2-practical.js?v=20261118"></script>
<script>
(()=>{'use strict';
const BANK=(window.NP2_BANK||[]),BLUEPRINT=window.NP2_BLUEPRINT||[],KEY='neuroprep-midterm2-v1';
const byId=new Map(BANK.map(q=>[q.id,q]));let model={theme:'dark',active:null,history:[],bookmarks:[],topicSelect:BLUEPRINT.map(x=>x.topic)};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')model={...model,...x}}catch(e){}
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(model))}catch(e){}};
const shuffled=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const questionGroup=t=>BANK.filter(x=>x.topic===t);const targetSum=BLUEPRINT.reduce((a,b)=>a+b.count,0);
const diagram=(id)=>{if(!id)return'';let shapes={
eye:'<ellipse cx="180" cy="102" rx="118" ry="81" fill="#e0f2fe" stroke="#1e3a5f" stroke-width="4"/><path d="M69 75 Q45 100 69 128" fill="none" stroke="#2563eb" stroke-width="7"/><path d="M93 46 Q115 100 92 155" fill="none" stroke="#64748b" stroke-width="12"/><path d="M256 39 Q210 102 256 163" fill="none" stroke="#e8798b" stroke-width="11"/><path d="M298 95 L348 80 L348 124 L298 109 Z" fill="#d1d5db" stroke="#475569"/><circle cx="251" cy="100" r="10" fill="#f59e0b"/><text x="261" y="39" font-size="21" fill="#a21caf" font-weight="700">A</text><text x="74" y="42" font-size="21" fill="#a21caf" font-weight="700">B</text><text x="320" y="70" font-size="21" fill="#a21caf" font-weight="700">C</text>',
ear:'<path d="M43 76 Q30 25 77 31 Q114 38 89 92 Q65 124 118 122" fill="none" stroke="#e6a2a4" stroke-width="15" stroke-linecap="round"/><path d="M93 103 L152 103" stroke="#64748b" stroke-width="21"/><path d="M158 62 L176 143" stroke="#c78b45" stroke-width="7"/><path d="M178 77 L210 94 L223 73" stroke="#b97939" stroke-width="8" fill="none"/><path d="M225 66 L226 112" stroke="#905f30" stroke-width="7"/><path d="M246 78 C260 32 317 39 317 83 C317 111 265 114 265 83 C265 64 298 68 295 85" stroke="#9c7cee" stroke-width="12" fill="none"/><path d="M253 138 Q298 155 330 138" stroke="#41a5af" stroke-width="8" fill="none"/><text x="143" y="43" font-size="21" fill="#a21caf" font-weight="700">A</text><text x="202" y="55" font-size="21" fill="#a21caf" font-weight="700">B</text><text x="302" y="33" font-size="21" fill="#a21caf" font-weight="700">C</text>',
mouth:'<path d="M52 45 Q130 15 245 50 L255 98 L211 117 L186 155 L85 155 L50 117 Z" fill="#f9c4b3" stroke="#a76562" stroke-width="4"/><path d="M70 110 Q141 123 220 111" stroke="#a33d53" fill="none" stroke-width="6"/><path d="M132 112 L132 175" stroke="#f58e92" stroke-width="18" stroke-linecap="round"/><path d="M236 34 Q270 54 252 94" stroke="#64748b" fill="none" stroke-width="8"/><text x="103" y="38" font-size="21" fill="#a21caf" font-weight="700">A</text><text x="141" y="172" font-size="21" fill="#a21caf" font-weight="700">B</text><text x="266" y="71" font-size="21" fill="#a21caf" font-weight="700">C</text>'
};return '<figure class="figure"><svg viewBox="0 0 375 200" role="img" aria-label="Original simplified labeled anatomy schematic">'+shapes[id]+'</svg><figcaption>Original simplified schematic (not a cadaver photograph). Labels A, B, C mark structures used in some questions.</figcaption></figure>'};
const assignLevel=(q,index)=>q.level||2; // item level authored for educational practice only
const labelLevel=x=>({1:'First-order',2:'Second-order',3:'Third-order'}[x]||'Applied');
const savedProgress=()=>model.history.length?model.history[model.history.length-1]:null;
function home(){const last=savedProgress(),total=targetSum;const ongoing=model.active&&!model.active.finished;app.innerHTML=
'<section class="hero"><div class="panel"><div class="eyebrow">Nervous System • Weeks 4–5</div><h1>Hard clinical questions. Your actual exam blueprint.</h1><p>Focused practice in movement disorders, cerebellum, eye and visual pathways, vestibular physiology, hearing, and head/neck anatomy. Detailed explanations for every choice, key takeaways, cross-outs, and independent Midterm 2 progress.</p><div class="chips"><span class="chip">59-question exam</span><span class="chip">9 anatomy lab slots</span><span class="chip">18 / 27 / 14 cognitive target</span><span class="chip">5 answer options</span></div></div><div class="panel"><h2>Midterm 2 at a glance</h2><div class="metrics"><div class="metric"><strong>'+total+'</strong><small>Blueprint slots</small></div><div class="metric"><strong>'+BANK.length+'</strong><small>Practice items</small></div><div class="metric"><strong>'+model.history.length+'</strong><small>Completed sessions</small></div></div><p class="quiet">The 59-question blueprint is faculty supplied; individual question difficulty labels are study estimates, not faculty ratings.</p></div></section>'+
'<div class="grid"><section class="panel"><h2>Choose a practice mode</h2><p class="quiet">Study shows an explanation after each answer. Exam hides explanations until submission.</p><div class="flex"><button class="btn primary" data-action="start-full">▶ Full blueprint exam · 59</button><button class="btn" data-action="start-study">Study · 20</button><button class="btn" data-action="start-hard">Clinical drill · 40</button><button class="btn" data-action="start-focus">Selected topics · 20</button></div>'+(ongoing?'<div class="notice">You have an unfinished session. <button class="btn sm" data-action="resume">Resume session</button></div>':'')+(last?'<div class="notice">Most recent: '+last.score+'/'+last.total+' correct ('+Math.round(100*last.score/last.total)+'%). <button class="btn sm" data-action="review-last">Review answers</button></div>':'')+'<div class="notice">Study questions are independently authored from the uploaded Week 4/5 notes. Anatomy items use original simplified schematics, not the faculty lab photographs. Reviewing your actual lab images remains important.</div></section>'+
'<section class="panel"><div class="flex between"><h2>Topic filter</h2><button class="btn sm" data-action="select-all">Select all</button></div><p class="quiet">Used for selected-topic practice only. Numbers show official blueprint allocations.</p><div class="topic-list">'+BLUEPRINT.map(b=>'<label class="topic"><input type="checkbox" data-topic="'+esc(b.topic)+'" '+(model.topicSelect.includes(b.topic)?'checked':'')+'><span>'+esc(b.topic)+'</span><small>'+b.count+' Q</small></label>').join('')+'</div></section></div>';
}
const normOpts=x=>x.options.map((t,i)=>({text:typeof t==='string'?t:t.text,why:x.why?.[i]||'',i}));
function newSession(kind){if(model.active&&!model.active.finished&&!confirm('Replace your unfinished Midterm 2 session?'))return;
 let qs=[];if(kind==='full'){for(const slot of BLUEPRINT){const pool=shuffled(questionGroup(slot.topic));if(pool.length<slot.count){alert('Question bank is incomplete for '+slot.topic);return}qs.push(...pool.slice(0,slot.count))}qs=shuffled(qs)}
 else{const selected=kind==='focus'?model.topicSelect:BLUEPRINT.map(x=>x.topic);let pool=BANK.filter(x=>selected.includes(x.topic));if(kind==='hard')pool=pool.filter(x=>x.level>=2);qs=shuffled(pool).slice(0,kind==='hard'?40:20);if(!qs.length){alert('Select at least one topic with available questions.');return}}
 const items=qs.map(q=>({id:q.id,order:shuffled([0,1,2,3,4])}));model.active={kind,items,index:0,answers:{},crossouts:{},bookmarks:{},verified:{},finished:false,started:Date.now(),duration:kind==='full'?95:null,review:false};save();render()}
function getItem(){return model.active?.items?.[model.active.index]}function currentQ(){return byId.get(getItem()?.id)}
function timeLabel(){const a=model.active;const elapsed=Math.floor((Date.now()-a.started)/60000);return a.duration?'Suggested time: '+a.duration+' min · elapsed '+elapsed+' min':'Untimed study'}
function feedbackHtml(q,chosen){const opt=normOpts(q);return '<div class="feedback"><b>'+(chosen===q.answer?'✓ Correct':'✕ Incorrect')+'</b><p>'+esc(q.explanation)+'</p><div class="whyline"><strong>Why each option is right or wrong:</strong></div>'+opt.map((o,i)=>'<div class="whyline"><strong>'+String.fromCharCode(65+i)+(i===q.answer?' ✓':'')+': </strong>'+esc(o.why||((i===q.answer)?q.explanation:'Does not explain the clinical finding as directly as the keyed answer.'))+'</div>').join('')+'<p><strong>Key takeaway:</strong> '+esc(q.takeaway)+'</p><div class="quiet">Lecture: '+esc(q.topic)+' · Week '+esc(q.week||'4–5')+' · intended '+labelLevel(q.level)+'</div></div>'}
function quiz(){const a=model.active;if(!a){home();return}if(a.finished){results();return}const item=getItem(),q=currentQ();if(!q){home();return}const checked=a.answers[q.id],verified=!!a.verified[q.id];const isStudy=a.kind!=='full';const position=a.index+1;const opts=normOpts(q);app.innerHTML='<div class="card-main"><div class="flex between"><div class="flex"><button class="btn sm" data-action="home">← Dashboard</button><span class="pill">'+esc(a.kind==='full'?'Blueprint exam':'Study mode')+'</span></div><span class="quiet">'+timeLabel()+'</span></div><div class="progress"><div style="width:'+((position/a.items.length)*100)+'%"></div></div><section class="panel"><div class="question-head"><div><span class="eyebrow">'+esc(q.topic)+'</span><div class="count">Question '+position+' of '+a.items.length+' · Week '+(q.week||'4–5')+' · '+labelLevel(q.level)+'</div></div><div class="flex"><button class="btn sm" data-action="bookmark">'+(a.bookmarks[q.id]?'★ Saved':'☆ Bookmark')+'</button><span class="pill">'+(q.visual?'Anatomy schematic':'Clinical reasoning')+'</span></div></div><div class="qstem">'+esc(q.stem)+'</div>'+diagram(q.visual||'')+'<div class="options">'+item.order.map((ix,i)=>{const o=opts[ix];let cls=verified&&ix===q.answer?' correct':verified&&ix===checked&&ix!==q.answer?' wrong':ix===checked?' selected':a.crossouts[q.id]?.includes(ix)?' crossed':'';return '<div class="option"><button class="choice'+cls+'" data-choice="'+ix+'" '+(verified?'disabled':'')+'><strong>'+String.fromCharCode(65+i)+'.</strong><span>'+esc(o.text)+'</span></button><button class="strike" data-strike="'+ix+'" '+(verified?'disabled':'')+' title="Cross out this answer" aria-label="Cross out this option">╱</button></div>'}).join('')+'</div>'+(isStudy&&verified?feedbackHtml(q,checked):'')+'<div class="toolrow"><div class="flex"><button class="btn sm" data-action="prev" '+(a.index===0?'disabled':'')+'>← Previous</button><button class="btn sm" data-action="hint">Hint</button></div><div class="flex">'+(isStudy&&!verified?'<button class="btn primary" data-action="check" '+(checked===undefined?'disabled':'')+'>Check answer</button>':'')+(a.index===a.items.length-1?'<button class="btn primary" data-action="finish">Finish & review</button>':'<button class="btn primary" data-action="next">Next →</button>')+'</div></div><p id="hint" class="hint hidden">'+esc(q.hint||'Identify the lesion or mechanism, then compare each answer against the findings.')+'</p></section><p class="quiet">Keys 1–5 select, Shift+1–5 cross out, ← / → navigate. Your session is saved in this browser.</p></div>'}
function finish(){let a=model.active;if(!a)return;const correct=a.items.filter(({id})=>a.answers[id]===byId.get(id).answer).length;let datum={score:correct,total:a.items.length,when:new Date().toISOString(),items:a.items.map(x=>x.id),answers:{...a.answers},kind:a.kind};model.history.push(datum);if(model.history.length>50)model.history=model.history.slice(-50);a.finished=true;a.review=false;save();results()}
function results(){let a=model.active,fromHistory=a?.reviewHistory,dat=fromHistory||model.history[model.history.length-1];if(!dat){home();return}let selected=a?.reviewHistory?dat.items:a.items.map(x=>x.id);let answers=dat.answers||{};let missed=selected.filter(id=>answers[id]!==byId.get(id)?.answer).length;app.innerHTML='<div class="card-main"><div class="flex between"><h1>Session results</h1><button class="btn sm" data-action="home">← Dashboard</button></div><section class="panel"><div class="eyebrow">Completed '+esc(new Date(dat.when).toLocaleString())+'</div><div class="result-grid"><div class="metric"><strong>'+dat.score+'</strong><small>Correct</small></div><div class="metric"><strong>'+dat.total+'</strong><small>Questions</small></div><div class="metric"><strong>'+Math.round(100*dat.score/dat.total)+'%</strong><small>Score</small></div></div><p>'+missed+' missed or unanswered. Review below includes individual distractor rationales and learning takeaways.</p><div class="flex"><button class="btn primary" data-action="start-full">New blueprint exam</button><button class="btn" data-action="start-study">New practice set</button></div></section>'+selected.map((id,i)=>{let q=byId.get(id),given=answers[id];if(!q)return'';let good=given===q.answer;return '<details class="panel" style="margin-top:10px;padding:14px 18px" '+(!good?'open':'')+'><summary style="cursor:pointer"><b>'+(good?'✓':'✕')+' #'+(i+1)+' · '+esc(q.topic)+'</b> <span class="quiet">'+(good?'Correct':'Review')+'</span></summary><p style="color:var(--text);font-size:.86rem">'+esc(q.stem)+'</p>'+diagram(q.visual||'')+'<p class="quiet">Your answer: '+(given===undefined?'Unanswered':esc(q.options[given]))+' · Correct: '+esc(q.options[q.answer])+'</p>'+feedbackHtml(q,given)+'</details>'}).join('')+'</div>'}
function render(){if(!model.active)home();else if(model.active.finished)results();else quiz()}
app.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-choice],[data-strike]');if(!el)return;const act=el.dataset.action;let a=model.active;if(el.dataset.choice!==undefined){let q=currentQ();if(a.verified[q.id])return;a.answers[q.id]=+el.dataset.choice;save();quiz();return}
 if(el.dataset.strike!==undefined){let q=currentQ(),ix=+el.dataset.strike;let s=a.crossouts[q.id]||[];a.crossouts[q.id]=s.includes(ix)?s.filter(t=>t!==ix):[...s,ix];save();quiz();return}
 if(act==='start-full')return newSession('full');if(act==='start-study')return newSession('study');if(act==='start-hard')return newSession('hard');if(act==='start-focus')return newSession('focus');
 if(act==='home'){home();return}if(act==='resume'){render();return}if(act==='select-all'){model.topicSelect=BLUEPRINT.map(x=>x.topic);save();home();return}
 if(act==='review-last'){model.active={finished:true,reviewHistory:model.history[model.history.length-1]};save();results();return}
 if(!a)return;if(act==='prev'){a.index=Math.max(0,a.index-1);save();quiz()}if(act==='next'){a.index=Math.min(a.items.length-1,a.index+1);save();quiz()}if(act==='check'){let q=currentQ();if(a.answers[q.id]===undefined)return;a.verified[q.id]=true;save();quiz()}if(act==='finish'){if(!confirm('Submit the session and reveal explanations?'))return;finish()}if(act==='bookmark'){let q=currentQ();a.bookmarks[q.id]=!a.bookmarks[q.id];if(a.bookmarks[q.id])model.bookmarks=[...new Set([...model.bookmarks,q.id])];else model.bookmarks=model.bookmarks.filter(x=>x!==q.id);save();quiz()}if(act==='hint'){document.getElementById('hint')?.classList.toggle('hidden')}
});
app.addEventListener('change',e=>{let inp=e.target.closest('[data-topic]');if(!inp)return;let t=inp.dataset.topic;if(inp.checked)model.topicSelect=[...new Set([...model.topicSelect,t])];else model.topicSelect=model.topicSelect.filter(x=>x!==t);save()});
document.getElementById('theme').onclick=()=>{model.theme=model.theme==='dark'?'light':'dark';document.body.classList.toggle('light',model.theme==='light');save()};
document.body.classList.toggle('light',model.theme==='light');window.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;let a=model.active;if(!a||a.finished)return;let m=/^([1-5])$/.exec(e.key);if(m){e.preventDefault();let idx=getItem().order[+m[1]-1],q=currentQ();if(a.verified[q.id])return;if(e.shiftKey){let s=a.crossouts[q.id]||[];a.crossouts[q.id]=s.includes(idx)?s.filter(i=>i!==idx):[...s,idx]}else a.answers[q.id]=idx;save();quiz()}if(e.key==='ArrowRight'&&a.index<a.items.length-1){a.index++;save();quiz()}if(e.key==='ArrowLeft'&&a.index>0){a.index--;save();quiz()}});
window.NP2_DIAGNOSTICS={items:BANK.length,blueprint:targetSum,missing:BLUEPRINT.filter(x=>questionGroup(x.topic).length<x.count).map(x=>x.topic),counts:Object.fromEntries(BLUEPRINT.map(x=>[x.topic,questionGroup(x.topic).length]))};render();
})();
</script></body></html>
